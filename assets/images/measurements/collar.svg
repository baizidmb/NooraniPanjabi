<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdfbf7"/>
    </linearGradient>
    <linearGradient id="goldGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#99782b"/>
      <stop offset="50%" stop-color="#e8ca82"/>
      <stop offset="100%" stop-color="#99782b"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#064332" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="200" rx="14" fill="url(#bgGrad5)"/>
  <rect width="318" height="198" x="1" y="1" rx="13" fill="none" stroke="#cfa853" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Subtle Tailoring Grid Pattern -->
  <g opacity="0.04" stroke="#064332" stroke-width="1">
    <line x1="20" y1="0" x2="20" y2="200"/>
    <line x1="60" y1="0" x2="60" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="140" y1="0" x2="140" y2="200"/>
    <line x1="180" y1="0" x2="180" y2="200"/>
    <line x1="220" y1="0" x2="220" y2="200"/>
    <line x1="260" y1="0" x2="260" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="0" y1="40" x2="320" y2="40"/>
    <line x1="0" y1="80" x2="320" y2="80"/>
    <line x1="0" y1="120" x2="320" y2="120"/>
    <line x1="0" y1="160" x2="320" y2="160"/>
  </g>

  <!-- Close-Up View of Neck and Collar -->
  <g transform="translate(90, 16)" filter="url(#shadow5)">
    <!-- Neck Form -->
    <path d="M38 18 C38 48 58 58 65 58 C72 58 92 48 92 18" fill="#f4ede1" stroke="#064332" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Shoulders Flaring Out -->
    <path d="M28 65 L0 80 L8 165 L122 165 L130 80 L102 65 Z" fill="#fbf9f5" stroke="#064332" stroke-width="1.8"/>

    <!-- Mandarin Collar Band (Detailed) -->
    <path d="M30 60 C38 68 92 68 100 60 L102 46 C94 52 36 52 28 46 Z" fill="#04261f" stroke="#cfa853" stroke-width="1.5"/>
    <path d="M48 61 L48 48" stroke="#cfa853" stroke-width="1" opacity="0.5"/>
    <path d="M82 61 L82 48" stroke="#cfa853" stroke-width="1" opacity="0.5"/>

    <!-- Front Placket (Button strip) -->
    <path d="M57 60 L57 150 L73 150 L73 60 Z" fill="#f4ede1" stroke="#064332" stroke-width="1.5"/>
    <line x1="65" y1="62" x2="65" y2="150" stroke="#064332" stroke-width="1.5"/>
    <circle cx="65" cy="78" r="2" fill="#cfa853"/>
    <circle cx="65" cy="100" r="2" fill="#cfa853"/>
    <circle cx="65" cy="122" r="2" fill="#cfa853"/>
  </g>

  <!-- MEASUREMENT INDICATOR: Collar / কলার (Loop Tape Around Neck) -->
  <g transform="translate(90, 16)">
    <!-- Dotted Tape Behind Neck -->
    <path d="M32 50 C40 34 90 34 98 50" fill="none" stroke="#cfa853" stroke-width="2.2" stroke-dasharray="3,3"/>

    <!-- Solid Measuring Tape Circling Around Front Base of Neck -->
    <path d="M26 50 C36 76 94 76 104 50" fill="none" stroke="url(#goldGrad5)" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Measuring Tape Ticks -->
    <path d="M26 50 C36 76 94 76 104 50" fill="none" stroke="#04261f" stroke-width="1" stroke-dasharray="2,6"/>

    <!-- Arrows at Tape Ends -->
    <polygon points="22,48 30,44 28,54" fill="#99782b"/>
    <polygon points="108,48 100,44 102,54" fill="#99782b"/>

    <!-- 1 Finger Ease Indicator Badge on Collar -->
    <g transform="translate(42, 85)">
      <rect width="46" height="18" rx="5" fill="#064332" stroke="#e8ca82" stroke-width="1"/>
      <text x="23" y="12" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#e8ca82">১ আঙুল লুজ</text>
    </g>
    <line x1="65" y1="85" x2="65" y2="70" stroke="#cfa853" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- Informative Callout Pill -->
  <g transform="translate(202, 32)">
    <rect width="106" height="46" rx="10" fill="#04261f" stroke="#cfa853" stroke-width="1.2" filter="url(#shadow5)"/>
    <text x="12" y="18" font-family="sans-serif" font-size="10" font-weight="bold" fill="#e8ca82">কলার / COLLAR</text>
    <text x="12" y="34" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff">১৪.৫" - ১৭"</text>
  </g>

  <!-- Step Instruction Badge -->
  <g transform="translate(202, 90)">
    <rect width="106" height="52" rx="8" fill="#f4ede1" stroke="#cfa853" stroke-width="0.8"/>
    <text x="8" y="16" font-family="sans-serif" font-size="9" font-weight="bold" fill="#064332">পরিমাপের নিয়ম:</text>
    <text x="8" y="29" font-family="sans-serif" font-size="8.5" fill="#57534e">গলার গোড়ায় ফিতা ধরে</text>
    <text x="8" y="42" font-family="sans-serif" font-size="8.5" fill="#57534e">১ আঙুল জায়গা রাখুন।</text>
  </g>

  <!-- Step Number Indicator Tag -->
  <g transform="translate(14, 14)">
    <circle cx="14" cy="14" r="13" fill="#064332"/>
    <text x="14" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e8ca82">৫</text>
  </g>
</svg>
