<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdfbf7"/>
    </linearGradient>
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#99782b"/>
      <stop offset="50%" stop-color="#e8ca82"/>
      <stop offset="100%" stop-color="#99782b"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#064332" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="200" rx="14" fill="url(#bgGrad4)"/>
  <rect width="318" height="198" x="1" y="1" rx="13" fill="none" stroke="#cfa853" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Subtle Tailoring Grid Pattern -->
  <g opacity="0.04" stroke="#064332" stroke-width="1">
    <line x1="20" y1="0" x2="20" y2="200"/>
    <line x1="60" y1="0" x2="60" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="140" y1="0" x2="140" y2="200"/>
    <line x1="180" y1="0" x2="180" y2="200"/>
    <line x1="220" y1="0" x2="220" y2="200"/>
    <line x1="260" y1="0" x2="260" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="0" y1="40" x2="320" y2="40"/>
    <line x1="0" y1="80" x2="320" y2="80"/>
    <line x1="0" y1="120" x2="320" y2="120"/>
    <line x1="0" y1="160" x2="320" y2="160"/>
  </g>

  <!-- Panjabi Silhouette / Back Yoke View -->
  <g transform="translate(100, 26)" filter="url(#shadow4)">
    <!-- Neck Base & Rear Collar Curve -->
    <path d="M42 20 C42 12 70 12 70 20" fill="none" stroke="#064332" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M42 20 C46 16 66 16 70 20 L72 24 C66 20 46 20 40 24 Z" fill="#04261f" opacity="0.85"/>

    <!-- Panjabi Shoulders and Yoke -->
    <path d="M42 20 L10 38 L22 96 L36 92 L34 56 L34 150 L78 150 L78 56 L76 92 L90 96 L102 38 L70 20 Z" 
          fill="#f4ede1" stroke="#064332" stroke-width="1.8" stroke-linejoin="round"/>
    
    <!-- Yoke Stitches (Back shoulder seam) -->
    <path d="M12 40 Q56 46 100 40" fill="none" stroke="#064332" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.5"/>
    <line x1="56" y1="45" x2="56" y2="150" stroke="#064332" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  </g>

  <!-- MEASUREMENT INDICATOR: Shoulder / তিরা (Shoulder tip to Shoulder tip) -->
  <g transform="translate(100, 26)">
    <!-- Horizontal Measuring Line slightly arched over collar -->
    <path d="M10 38 Q56 28 102 38" fill="none" stroke="url(#goldGrad4)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Measuring Tape Ticks -->
    <path d="M10 38 Q56 28 102 38" fill="none" stroke="#04261f" stroke-width="1.2" stroke-dasharray="2,6"/>

    <!-- Left & Right Arrow Heads -->
    <polygon points="6,38 14,32 14,44" fill="#99782b"/>
    <polygon points="106,38 98,32 98,44" fill="#99782b"/>

    <!-- Left Shoulder Bone Joint Crosshair -->
    <circle cx="10" cy="38" r="5" fill="#064332" stroke="#e8ca82" stroke-width="2"/>
    <line x1="10" y1="20" x2="10" y2="52" stroke="#cfa853" stroke-width="1.2" stroke-dasharray="2,2"/>

    <!-- Right Shoulder Bone Joint Crosshair -->
    <circle cx="102" cy="38" r="5" fill="#064332" stroke="#e8ca82" stroke-width="2"/>
    <line x1="102" y1="20" x2="102" y2="52" stroke="#cfa853" stroke-width="1.2" stroke-dasharray="2,2"/>
  </g>

  <!-- Informative Callout Pill -->
  <g transform="translate(202, 32)">
    <rect width="106" height="46" rx="10" fill="#04261f" stroke="#cfa853" stroke-width="1.2" filter="url(#shadow4)"/>
    <text x="12" y="18" font-family="sans-serif" font-size="10" font-weight="bold" fill="#e8ca82">তিরা / SHOULDER</text>
    <text x="12" y="34" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff">১৭" - ২০"</text>
  </g>

  <!-- Step Instruction Badge -->
  <g transform="translate(202, 90)">
    <rect width="106" height="52" rx="8" fill="#f4ede1" stroke="#cfa853" stroke-width="0.8"/>
    <text x="8" y="16" font-family="sans-serif" font-size="9" font-weight="bold" fill="#064332">পরিমাপের নিয়ম:</text>
    <text x="8" y="29" font-family="sans-serif" font-size="8.5" fill="#57534e">পিছনের এক কাঁধের হাড়</text>
    <text x="8" y="42" font-family="sans-serif" font-size="8.5" fill="#57534e">থেকে অপর কাঁধের হাড়।</text>
  </g>

  <!-- Step Number Indicator Tag -->
  <g transform="translate(14, 14)">
    <circle cx="14" cy="14" r="13" fill="#064332"/>
    <text x="14" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e8ca82">৪</text>
  </g>
</svg>
