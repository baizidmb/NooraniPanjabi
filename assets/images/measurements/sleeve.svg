<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdfbf7"/>
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8ca82"/>
      <stop offset="50%" stop-color="#cfa853"/>
      <stop offset="100%" stop-color="#99782b"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#064332" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="200" rx="14" fill="url(#bgGrad3)"/>
  <rect width="318" height="198" x="1" y="1" rx="13" fill="none" stroke="#cfa853" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Subtle Tailoring Grid Pattern -->
  <g opacity="0.04" stroke="#064332" stroke-width="1">
    <line x1="20" y1="0" x2="20" y2="200"/>
    <line x1="60" y1="0" x2="60" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="140" y1="0" x2="140" y2="200"/>
    <line x1="180" y1="0" x2="180" y2="200"/>
    <line x1="220" y1="0" x2="220" y2="200"/>
    <line x1="260" y1="0" x2="260" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="0" y1="40" x2="320" y2="40"/>
    <line x1="0" y1="80" x2="320" y2="80"/>
    <line x1="0" y1="120" x2="320" y2="120"/>
    <line x1="0" y1="160" x2="320" y2="160"/>
  </g>

  <!-- Panjabi Silhouette / Mannequin with Highlighted Extended Arm -->
  <g transform="translate(65, 16)" filter="url(#shadow3)">
    <!-- Collar & Torso Base -->
    <path d="M75 22 C78 26 95 26 98 22 L100 18 C95 21 78 21 75 18 Z" fill="#04261f" opacity="0.85"/>
    <path d="M75 22 L55 32 L60 85 L70 82 L68 50 L68 165 L108 165 L108 50 L118 82 L128 85 L132 32 L98 22 Z" 
          fill="#f4ede1" stroke="#064332" stroke-width="1.6" stroke-linejoin="round" opacity="0.5"/>
    
    <!-- Active Arm / Sleeve (Left side, extended slightly bent) -->
    <path d="M55 32 Q26 78 18 126 L30 128 Q40 85 68 50 Z" 
          fill="#fbf9f5" stroke="#064332" stroke-width="2.2" stroke-linejoin="round"/>
    
    <!-- Cuff Band -->
    <rect x="17" y="123" width="14" height="6" rx="1.5" fill="#04261f" stroke="#cfa853" stroke-width="1"/>
  </g>

  <!-- MEASUREMENT INDICATOR: Sleeve / হাতা (Shoulder seam to Wrist) -->
  <g transform="translate(65, 16)">
    <!-- Top Shoulder Joint Point -->
    <circle cx="55" cy="32" r="5" fill="#064332" stroke="#e8ca82" stroke-width="2"/>
    <line x1="55" y1="16" x2="55" y2="32" stroke="#cfa853" stroke-width="1.5" stroke-dasharray="2,2"/>
    
    <!-- Measuring Tape Curve along Sleeve Outer Edge -->
    <path d="M50 32 Q20 80 12 126" fill="none" stroke="url(#goldGrad3)" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Measuring Tape Ticks along the curve -->
    <g stroke="#99782b" stroke-width="1.2">
      <line x1="44" y1="44" x2="49" y2="42"/>
      <line x1="37" y1="58" x2="42" y2="56"/>
      <line x1="30" y1="74" x2="36" y2="73"/>
      <line x1="24" y1="90" x2="30" y2="90"/>
      <line x1="18" y1="106" x2="24" y2="107"/>
      <line x1="14" y1="120" x2="20" y2="122"/>
    </g>

    <!-- Top & Bottom Arrows -->
    <polygon points="52,27 44,32 50,37" fill="#99782b"/>
    <polygon points="12,130 8,122 17,124" fill="#99782b"/>

    <!-- Bottom Cuff Joint Point -->
    <circle cx="17" cy="126" r="5" fill="#064332" stroke="#e8ca82" stroke-width="2"/>
    <line x1="17" y1="126" x2="2" y2="126" stroke="#cfa853" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Wrist Bone Marker Label -->
    <circle cx="24" cy="132" r="2.5" fill="#cfa853"/>
  </g>

  <!-- Informative Callout Pill -->
  <g transform="translate(202, 32)">
    <rect width="106" height="46" rx="10" fill="#04261f" stroke="#cfa853" stroke-width="1.2" filter="url(#shadow3)"/>
    <text x="12" y="18" font-family="sans-serif" font-size="10" font-weight="bold" fill="#e8ca82">হাতা / SLEEVE</text>
    <text x="12" y="34" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff">২৩.৫" - ২৬"</text>
  </g>

  <!-- Step Instruction Badge -->
  <g transform="translate(202, 90)">
    <rect width="106" height="52" rx="8" fill="#f4ede1" stroke="#cfa853" stroke-width="0.8"/>
    <text x="8" y="16" font-family="sans-serif" font-size="9" font-weight="bold" fill="#064332">পরিমাপের নিয়ম:</text>
    <text x="8" y="29" font-family="sans-serif" font-size="8.5" fill="#57534e">কাঁধের হাড় থেকে হাত</text>
    <text x="8" y="42" font-family="sans-serif" font-size="8.5" fill="#57534e">সামান্য বাঁকা রেখে কব্জি।</text>
  </g>

  <!-- Step Number Indicator Tag -->
  <g transform="translate(14, 14)">
    <circle cx="14" cy="14" r="13" fill="#064332"/>
    <text x="14" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e8ca82">৩</text>
  </g>
</svg>
