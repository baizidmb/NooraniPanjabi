<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdfbf7"/>
    </linearGradient>
    <linearGradient id="goldGrad6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#99782b"/>
      <stop offset="50%" stop-color="#e8ca82"/>
      <stop offset="100%" stop-color="#99782b"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#064332" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="200" rx="14" fill="url(#bgGrad6)"/>
  <rect width="318" height="198" x="1" y="1" rx="13" fill="none" stroke="#cfa853" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Subtle Tailoring Grid Pattern -->
  <g opacity="0.04" stroke="#064332" stroke-width="1">
    <line x1="20" y1="0" x2="20" y2="200"/>
    <line x1="60" y1="0" x2="60" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="140" y1="0" x2="140" y2="200"/>
    <line x1="180" y1="0" x2="180" y2="200"/>
    <line x1="220" y1="0" x2="220" y2="200"/>
    <line x1="260" y1="0" x2="260" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="0" y1="40" x2="320" y2="40"/>
    <line x1="0" y1="80" x2="320" y2="80"/>
    <line x1="0" y1="120" x2="320" y2="120"/>
    <line x1="0" y1="160" x2="320" y2="160"/>
  </g>

  <!-- Panjabi Silhouette / Midsection Focus -->
  <g transform="translate(100, 16)" filter="url(#shadow6)">
    <!-- Collar & Upper Torso -->
    <path d="M44 24 C48 28 68 28 72 24 L74 20 C68 23 48 23 44 20 Z" fill="#04261f" opacity="0.85"/>
    
    <!-- Torso Silhouette with realistic natural waist curve -->
    <path d="M44 24 L14 36 L24 88 L34 84 L32 50 Q36 100 28 165 L88 165 Q80 100 84 50 L82 84 L92 88 L102 36 L72 24 Z" 
          fill="#f4ede1" stroke="#064332" stroke-width="1.8" stroke-linejoin="round"/>
    
    <!-- Front Placket (Button strip) -->
    <line x1="58" y1="26" x2="58" y2="88" stroke="#064332" stroke-width="2" stroke-linecap="round"/>
    <circle cx="58" cy="38" r="1.5" fill="#cfa853"/>
    <circle cx="58" cy="52" r="1.5" fill="#cfa853"/>
    <circle cx="58" cy="66" r="1.5" fill="#cfa853"/>
    <circle cx="58" cy="80" r="1.5" fill="#cfa853"/>

    <!-- Side Pocket Slit Lines -->
    <line x1="31" y1="110" x2="31" y2="135" stroke="#064332" stroke-width="2" opacity="0.6"/>
    <line x1="85" y1="110" x2="85" y2="135" stroke="#064332" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- MEASUREMENT INDICATOR: Waist / কোমর (Circumference Band at Belly/Navel) -->
  <g transform="translate(100, 16)">
    <!-- Back Dotted Wrap Line -->
    <path d="M30 110 Q58 100 86 110" fill="none" stroke="#cfa853" stroke-width="2" stroke-dasharray="3,3" opacity="0.7"/>

    <!-- Front Solid Measuring Tape Band at Belly -->
    <path d="M26 112 Q58 126 90 112" fill="none" stroke="url(#goldGrad6)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Measuring Tape Ticks on Front -->
    <path d="M26 112 Q58 126 90 112" fill="none" stroke="#04261f" stroke-width="1" stroke-dasharray="2,6"/>

    <!-- End Arrows -->
    <polygon points="22,112 30,106 30,118" fill="#99782b"/>
    <polygon points="94,112 86,106 86,118" fill="#99782b"/>

    <!-- Crosshair Markers -->
    <circle cx="31" cy="112" r="4.5" fill="#064332" stroke="#e8ca82" stroke-width="1.8"/>
    <circle cx="85" cy="112" r="4.5" fill="#064332" stroke="#e8ca82" stroke-width="1.8"/>

    <!-- Highlighted Waist/Belly Ease Region -->
    <rect x="31" y="100" width="54" height="26" rx="4" fill="#cfa853" fill-opacity="0.15" stroke="#cfa853" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- Informative Callout Pill -->
  <g transform="translate(202, 32)">
    <rect width="106" height="46" rx="10" fill="#04261f" stroke="#cfa853" stroke-width="1.2" filter="url(#shadow6)"/>
    <text x="12" y="18" font-family="sans-serif" font-size="10" font-weight="bold" fill="#e8ca82">কোমর / WAIST</text>
    <text x="12" y="34" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff">৩৮" - ৪৬"</text>
  </g>

  <!-- Step Instruction Badge -->
  <g transform="translate(202, 90)">
    <rect width="106" height="52" rx="8" fill="#f4ede1" stroke="#cfa853" stroke-width="0.8"/>
    <text x="8" y="16" font-family="sans-serif" font-size="9" font-weight="bold" fill="#064332">পরিমাপের নিয়ম:</text>
    <text x="8" y="29" font-family="sans-serif" font-size="8.5" fill="#57534e">পেটের ভারী অংশে ফিতা</text>
    <text x="8" y="42" font-family="sans-serif" font-size="8.5" fill="#57534e">আলতোভাবে ধরে মাপুন।</text>
  </g>

  <!-- Step Number Indicator Tag -->
  <g transform="translate(14, 14)">
    <circle cx="14" cy="14" r="13" fill="#064332"/>
    <text x="14" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e8ca82">৬</text>
  </g>
</svg>
