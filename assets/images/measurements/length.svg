<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdfbf7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8ca82"/>
      <stop offset="50%" stop-color="#cfa853"/>
      <stop offset="100%" stop-color="#99782b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#064332" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="200" rx="14" fill="url(#bgGrad)"/>
  <rect width="318" height="198" x="1" y="1" rx="13" fill="none" stroke="#cfa853" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Subtle Tailoring Grid Pattern -->
  <g opacity="0.04" stroke="#064332" stroke-width="1">
    <line x1="20" y1="0" x2="20" y2="200"/>
    <line x1="60" y1="0" x2="60" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="140" y1="0" x2="140" y2="200"/>
    <line x1="180" y1="0" x2="180" y2="200"/>
    <line x1="220" y1="0" x2="220" y2="200"/>
    <line x1="260" y1="0" x2="260" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="0" y1="40" x2="320" y2="40"/>
    <line x1="0" y1="80" x2="320" y2="80"/>
    <line x1="0" y1="120" x2="320" y2="120"/>
    <line x1="0" y1="160" x2="320" y2="160"/>
  </g>

  <!-- Panjabi Silhouette / Mannequin -->
  <g transform="translate(105, 14)" filter="url(#shadow)">
    <!-- Head / Neck Outline -->
    <path d="M40 8 C40 18 52 24 55 24 C58 24 70 18 70 8" fill="none" stroke="#064332" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Mandarin Band Collar -->
    <path d="M42 24 C45 28 65 28 68 24 L70 20 C65 23 45 23 40 20 Z" fill="#04261f" opacity="0.85"/>
    
    <!-- Panjabi Body Outline -->
    <path d="M42 24 L14 36 L24 90 L34 86 L32 50 L32 170 L78 170 L78 50 L76 86 L86 90 L96 36 L68 24 Z" 
          fill="#f4ede1" stroke="#064332" stroke-width="1.8" stroke-linejoin="round"/>
    
    <!-- Front Placket (Button strip) -->
    <line x1="55" y1="26" x2="55" y2="88" stroke="#064332" stroke-width="2" stroke-linecap="round"/>
    <circle cx="55" cy="38" r="1.5" fill="#cfa853"/>
    <circle cx="55" cy="52" r="1.5" fill="#cfa853"/>
    <circle cx="55" cy="66" r="1.5" fill="#cfa853"/>
    <circle cx="55" cy="80" r="1.5" fill="#cfa853"/>
    
    <!-- Side Slits (Chak) -->
    <line x1="32" y1="125" x2="32" y2="170" stroke="#064332" stroke-width="2.5" opacity="0.7"/>
    <line x1="78" y1="125" x2="78" y2="170" stroke="#064332" stroke-width="2.5" opacity="0.7"/>
    
    <!-- Pocket Crease -->
    <path d="M72 85 Q75 105 74 115" fill="none" stroke="#064332" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
  </g>

  <!-- MEASUREMENT INDICATOR: Length / ঝুল (Vertical Tape) -->
  <g transform="translate(68, 14)">
    <!-- Top Horizontal Marker (Shoulder seam) -->
    <line x1="60" y1="24" x2="90" y2="24" stroke="#cfa853" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle cx="78" cy="24" r="4" fill="#064332" stroke="#e8ca82" stroke-width="1.5"/>
    
    <!-- Vertical Measuring Tape Line -->
    <line x1="26" y1="24" x2="26" y2="170" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Measuring Tape Ticks -->
    <g stroke="#99782b" stroke-width="1.2">
      <line x1="26" y1="36" x2="32" y2="36"/>
      <line x1="26" y1="48" x2="30" y2="48"/>
      <line x1="26" y1="60" x2="34" y2="60"/>
      <line x1="26" y1="72" x2="30" y2="72"/>
      <line x1="26" y1="84" x2="32" y2="84"/>
      <line x1="26" y1="96" x2="34" y2="96"/>
      <line x1="26" y1="108" x2="30" y2="108"/>
      <line x1="26" y1="120" x2="32" y2="120"/>
      <line x1="26" y1="132" x2="30" y2="132"/>
      <line x1="26" y1="144" x2="34" y2="144"/>
      <line x1="26" y1="156" x2="30" y2="156"/>
    </g>

    <!-- Top & Bottom Arrows -->
    <polygon points="26,20 22,28 30,28" fill="#99782b"/>
    <polygon points="26,174 22,166 30,166" fill="#99782b"/>

    <!-- Bottom Horizontal Marker (Hemline) -->
    <line x1="26" y1="170" x2="115" y2="170" stroke="#cfa853" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle cx="26" cy="170" r="4" fill="#064332" stroke="#e8ca82" stroke-width="1.5"/>

    <!-- Guide Line Connecting Shoulder to Tape -->
    <line x1="26" y1="24" x2="78" y2="24" stroke="#cfa853" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>

  <!-- Informative Callout Pill -->
  <g transform="translate(202, 32)">
    <rect width="106" height="46" rx="10" fill="#04261f" stroke="#cfa853" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="12" y="18" font-family="sans-serif" font-size="10" font-weight="bold" fill="#e8ca82">ঝুল / LENGTH</text>
    <text x="12" y="34" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff">৪০" - ৪৬"</text>
  </g>

  <!-- Step Instruction Badge -->
  <g transform="translate(202, 90)">
    <rect width="106" height="52" rx="8" fill="#f4ede1" stroke="#cfa853" stroke-width="0.8"/>
    <text x="8" y="16" font-family="sans-serif" font-size="9" font-weight="bold" fill="#064332">পরিমাপের নিয়ম:</text>
    <text x="8" y="29" font-family="sans-serif" font-size="8.5" fill="#57534e">কাঁধ থেকে হাঁটু বা</text>
    <text x="8" y="42" font-family="sans-serif" font-size="8.5" fill="#57534e">পছন্দের ঝুল পর্যন্ত।</text>
  </g>

  <!-- Step Number Indicator Tag -->
  <g transform="translate(14, 14)">
    <circle cx="14" cy="14" r="13" fill="#064332"/>
    <text x="14" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e8ca82">১</text>
  </g>
</svg>
